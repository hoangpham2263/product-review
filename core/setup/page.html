<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cấu hình</title>
<link rel="stylesheet" href="/setup/tool.css">
<script src="/setup/flow-check.js" defer></script>
<script src="/setup/page.js" defer></script>
<style>
/* Cấu hình as a page of its own (core/setup/config-api.mjs serves it to the menu and every tool's server), in the order
   it is used: 1 what is installed (and Cài / cập nhật tất cả AI), 2 each AI with the account it is signed in to,
   3 Model AI, 4 Lượt dùng AI. Every section is full width. */
.setup-page { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; }
.item .mark { font-size: 15px; color: var(--muted); line-height: 20px; }
.item .body { min-width: 0; display: grid; gap: 2px; }
.item .name { line-height: 20px; }
.item .account { overflow-wrap: anywhere; }
.item .account.none { color: var(--muted); }
.item .account-pick { max-width: 100%; height: 28px; margin-top: 2px; }
.item .detail, .item .uses { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.item .side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.item .side .btn { min-width: 110px; }
.item .err { color: #b06000; font-size: 12px; }
.fld .ccustom.bad { border-color: #b06000; }
.fld.cc:has(.ccustom[style*="hidden"]) { display: none; }
header .all { margin-left: auto; }
/* Cài đặt and Tài khoản AI: three short cards side by side (name, state, buttons). */
#ai, #base { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
#ai .item, #base .item { grid-template-columns: 22px minmax(0, 1fr); align-content: start; }
#ai .item .side, #base .item .side { grid-column: 2; flex-direction: row; flex-wrap: wrap; margin-top: 6px; }
#ai .item .side .btn, #base .item .side .btn { min-width: 0; height: 28px; padding: 0 10px; }
/* What Cài / cập nhật tất cả AI did, one line per AI, under the installed items. */
#all-result { display: grid; gap: 2px; margin: 10px 0 0; }
@media (max-width: 860px) { #ai, #base { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: minmax(0, 1fr); } }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
.fld > label { margin: 0 0 4px; }
.fld .row { display: flex; gap: 6px; align-items: center; }
.fld .row select, .fld .row input { flex: 1 1 auto; min-width: 0; width: auto; }
.fld .row .btn { height: 28px; padding: 0 10px; flex: none; }
.sub-title { margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.fb-check { margin-left: 6px; font-size: 11px; }
.fb-open .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.note-line { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
/* Lượt dùng AI: one row per AI and account. */
.usage { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
.usage th, .usage td { text-align: left; font-weight: 400; padding: 6px 10px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
.usage th { color: var(--muted); font-size: 12px; }
.usage td.num { white-space: nowrap; }
.usage .sub { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.usage .warn { color: #b06000; }
.usage-wrap { overflow-x: auto; }
@media (max-width: 760px) { .setup-page { grid-template-columns: minmax(0, 1fr); } }
/* Narrow window: the buttons go under the text, side by side. */
@media (max-width: 600px) { .item { grid-template-columns: 22px minmax(0, 1fr); } .item .side { grid-column: 2; flex-direction: row; flex-wrap: wrap; margin-top: 6px; } }
</style>
</head>
<body>
<main>
  <header><button class="btn back" type="button">← Quay lại</button><h1>Cấu hình</h1><button class="btn primary all" type="button">Cài / cập nhật tất cả AI</button><button class="btn again" type="button">Kiểm tra lại</button></header>
  <div class="layout setup-page">
    <section class="group wide"><h2>1. Cài đặt</h2><div class="items" id="base"></div><div class="note-line" id="all-result" hidden></div></section>
    <section class="group wide"><h2>2. Tài khoản AI</h2><div class="items" id="ai"></div></section>
    <section class="group wide" id="run-sec" hidden><h2>3. Cách chạy</h2>
      <div class="fgrid">
        <div class="fld"><label>Viết review</label><select class="rv-text"></select></div>
        <div class="fld"><label>Tạo ảnh</label><select class="rv-image"></select></div>
        <div class="fld"><label>Luồng</label><input class="rv-threads" type="number" min="1" max="4" step="1"></div>
        <div class="fld"><label>Quét web</label><select class="rv-scan"></select></div>
        <div class="fld"><label>Cập nhật review</label><select class="rv-reviews"></select></div>
        <div class="fld"><label>Hàng chờ &amp; chuẩn bị</label><select class="rv-queue"></select></div>
      </div>
      <div id="flow-only" hidden>
        <div class="sub-title">Trình duyệt cho Claude (Flow)</div>
        <div class="fgrid">
          <div class="fld"><label>Chrome profile</label><div class="row"><select class="fb-profile"></select><button class="btn fb-install" type="button" hidden>Cài extension</button></div></div>
          <div class="fld"><label>Tài khoản Flow <span class="fb-check"></span></label><select class="fb-account"></select></div>
          <div class="fld fb-token-box" hidden><label class="fb-token-label">Token Playwright (tùy chọn)</label><div class="row"><input class="fb-token" type="password" autocomplete="off" placeholder="Dán token của profile này"><button class="btn fb-token-save" type="button">Lưu</button><button class="btn fb-token-clear" type="button">Xoá</button></div></div>
          <div class="fld full"><label>Đăng nhập Google Flow</label><div class="row"><button class="btn fb-open" type="button"><span class="dot"></span>Mở Chrome để đăng nhập</button><button class="btn fb-recheck" type="button">Kiểm tra lại</button></div></div>
        </div>
      </div>
    </section>
    <section class="group wide"><h2>4. Model Codex</h2>
      <div class="fgrid"><div class="fld"><label>Model</label><select class="model"></select></div><div class="fld"><label>Mức suy nghĩ</label><select class="effort"></select></div></div>
    </section>
    <section class="group wide"><h2>5. Model Claude</h2>
      <div class="fgrid"><div class="fld"><label>Model</label><select class="cmodel"></select></div><div class="fld"><label>Mức suy nghĩ</label><select class="ceffort"></select></div><div class="fld cc"><label>Mã model</label><input class="ccustom" type="text" maxlength="60" placeholder="claude-opus-5-5" spellcheck="false" style="visibility: hidden"></div></div>
    </section>
    <section class="group wide"><h2>6. Antigravity</h2>
      <div class="fgrid"><div class="fld"><label>Model</label><select class="amodel"></select></div><div class="fld"><label>Mức suy nghĩ</label><select class="aeffort"></select></div></div>
    </section>
    <section class="group wide"><h2>7. Lượt dùng AI</h2><div class="usage-wrap"><table class="usage"><thead><tr><th>AI · tài khoản</th><th>Hôm nay</th><th>7 ngày</th><th>30 ngày</th><th>Lỗi gần nhất</th></tr></thead><tbody id="usage"><tr><td colspan="5" class="sub">Đang đọc…</td></tr></tbody></table></div></section>
  </div>
</main>
</body>
</html>
